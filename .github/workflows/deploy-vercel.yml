name: Deploy to Vercel (Production)

# How to activate:
# 1. In the Vercel dashboard, create a token: Settings -> Tokens -> Create
# 2. Add it to GitHub secrets as VERCEL_TOKEN (repo Settings -> Secrets and variables -> Actions)
# 3. Optionally set ORG_ID and PROJECT_ID (Settings -> General in Vercel; if unset,
#    the workflow auto-detects via `vercel pull`).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel project settings
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
